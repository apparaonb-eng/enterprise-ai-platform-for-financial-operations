version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: finops-db
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: finops
    ports:
      - "5432:5432"
    volumes:
      - finops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: finops-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://finops:finops@db:5432/finops
    depends_on:
      db:
        condition: service_healthy

volumes:
  finops_pgdata:
